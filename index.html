<!doctype html>
<html lang="pt-BR">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

<header class="appbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3 6 13.5h5L10 21l8-11h-5.2z"/></svg></span>
    <div class="brand-text"><b>Projetos e execução</b><small>FCU · Ferramenta de Controle Unificado</small></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do painel"></nav>
  <div class="actions">
    <button class="btn" id="btnImport"><svg class="ico"><use href="#i-up"/></svg><span>Importar</span></button>
    <div class="menu">
      <button class="btn primary" id="btnExport" aria-haspopup="true" aria-expanded="false"><svg class="ico"><use href="#i-down"/></svg><span>Exportar</span><svg class="ico" style="width:13px;height:13px"><use href="#i-caret"/></svg></button>
      <div class="menu-pop" id="exportMenu" hidden role="menu"></div>
    </div>
  </div>
</header>

<section class="filterbar" id="filterbar" aria-label="Filtros do painel"></section>

<main id="main">
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-perf"></section>
  <section class="tab" id="tab-cancel"></section>
  <section class="tab" id="tab-map"></section>
  <section class="tab" id="tab-projects"></section>
  <section class="tab" id="tab-programs"></section>
  <section class="tab" id="tab-equip"></section>
  <section class="tab" id="tab-quality"></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detalhes do projeto" aria-hidden="true"></aside>

<dialog id="dlgImport"></dialog>
<dialog id="dlgData" class="wide"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div class="busy-box"><div class="spin"></div><div><b id="busyTitle">Carregando…</b><span id="busyMsg"></span></div></div></div>

<script src="lib/jszip.min.js"></script>

<script src="data.js"></script>

<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/exporter.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
